jarvis:
  name: "Jarvis"
  language: "pt-BR"
  wake_word: "jarvis"
  timezone: "America/Sao_Paulo"

llm:
  provider: "ollama"
  model: "mistral-nemo:12b-instruct-2407-q4_K_M"
  fallback_model: "phi3:mini"
  base_url: "http://localhost:11434"
  context_window: 8192
  temperature: 0.4
  stream: true
  request_timeout_seconds: 90.0

voice:
  enabled: false
  sample_rate: 16000
  channels: 1
  chunk_size: 512
  wake_word_enabled: true
  wake_word_mode: "text"
  stt:
    model: "large-v3"
    device: "cuda"
    compute_type: "float16"
    language: "pt"
  tts:
    model: "pt_BR-faber-medium"
    fallback_model: "en_US-ryan-high"
    binary_path: "./bin/piper/piper.exe"
    pt_model_path: "./models/piper/pt_BR-faber-medium.onnx"
    en_model_path: "./models/piper/en_US-ryan-high.onnx"
    sample_rate: 22050
    speed: 1.0
  vad:
    threshold: 0.5
    min_silence_ms: 500

memory:
  provider: "chromadb"
  persist_directory: "./data/chroma"
  conversations_directory: "./data/conversations"
  embedding_model: "nomic-embed-text"
  max_context_docs: 5
  collection_name: "jarvis_memory"

browser:
  mode: "system_default"
  headless_for_scraping: true
  search_engine: "duckduckgo"
  max_results: 5
  snippet_char_limit: 2200

skills:
  app_launcher:
    enabled: true
    focus_existing: true
  browser_search:
    enabled: true
    open_for_user_threshold: 0.7
  clipboard:
    enabled: true
  file_manager:
    enabled: true
  screenshot:
    enabled: true
  notification:
    enabled: true
  spotify:
    enabled: true
  notion:
    enabled: true
    default_parent_page_id: ""
  outlook:
    enabled: true
  calendar:
    enabled: true
  volume:
    enabled: true
  auto_memory:
    enabled: true
    min_exchange_length: 20

spotify:
  token_path: "./data/spotify_token.json"
  scopes:
    - "user-read-playback-state"
    - "user-modify-playback-state"
    - "user-read-currently-playing"

notion:
  default_parent_id: ""
  default_parent_type: "page_id"

outlook:
  token_path: "./data/outlook_token.json"
  scopes:
    - "Mail.Read"
    - "Mail.Send"
    - "Calendars.ReadWrite"

google:
  token_path: "./data/google_token.json"
  scopes:
    - "https://www.googleapis.com/auth/calendar.readonly"
    - "https://www.googleapis.com/auth/calendar.events"

telemetry:
  error_log_path: "./data/logs/errors.jsonl"

api:
  host: "0.0.0.0"
  port: 8000
  reload: false
  cors_origins:
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"

dashboard:
  origin: "http://localhost:3000"
